name: "Release"

run-name: "Release"

on:
  workflow_dispatch:
    inputs:
      trigger_deploy_after_release:
        description: 'Trigger deploy after release'
        required: true
        type: boolean
        default: true
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        default: prod
        options:
          - dev
          - prod
      consolidate_history:
        description: 'Reset develop to main after release (force-push).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: helium-platform-release

jobs:
  prereq:
    uses: alexdlaird/.github/.github/workflows/release-prereq.yml@main
    with:
      version_pattern: 's/^__version__ = ".*"/__version__ = "${VERSION}"/'
      version_file: conf/configs/common.py
      repo_slug: HeliumEdu/platform
    secrets:
      bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}

  promote:
    name: Promote Containers
    needs: [prereq]
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SOURCE_TAG: ${{ needs.prereq.outputs.squash_boundary_sha }}
      TAG_VERSION: ${{ needs.prereq.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag the AMD64 and ARM64 images with the release version
        run: |
          make promote PLATFORM=amd64
          make promote PLATFORM=arm64

  sentry-release:
    name: Create Sentry Release
    needs: [prereq, promote]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}
          fetch-depth: 0

      - name: Create the Sentry release
        uses: alexdlaird/shipshape/sentry-release@v1
        with:
          version: ${{ needs.prereq.outputs.version }}
          sentry-properties: sentry.properties
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    name: Deploy
    needs: [prereq, sentry-release]
    if: "!cancelled() && (inputs.trigger_deploy_after_release == true || inputs.trigger_deploy_after_release == 'true') && needs['sentry-release'].result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run the deploy workflow and wait for it
        id: wait-for-deploy
        uses: alexdlaird/shipshape/run-workflow@v1
        with:
          workflow: deploy.yml
          ref: develop
          token: ${{ github.token }}
          timeout-minutes: 55
          inputs: |
            version_type=specific
            specific_version=${{ needs.prereq.outputs.version }}
            environment=${{ inputs.environment }}

      - name: Deployment trigger summary
        if: always()
        env:
          VERSION: ${{ needs.prereq.outputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          RUN_URL: ${{ steps.wait-for-deploy.outputs.run-url }}
        run: |
          echo "### Deploy Workflow Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          if [ -n "$RUN_URL" ]; then
            echo "- **Run**: $RUN_URL" >> $GITHUB_STEP_SUMMARY
          fi

  finish:
    needs: [prereq, sentry-release, deploy]
    if: always() && needs.prereq.result == 'success'
    uses: alexdlaird/.github/.github/workflows/release-finish.yml@main
    with:
      shipped: ${{ needs['sentry-release'].result == 'success' && (needs.deploy.result == 'success' || !(inputs.trigger_deploy_after_release == true || inputs.trigger_deploy_after_release == 'true')) }}
      version: ${{ needs.prereq.outputs.version }}
      squash_commit_sha: ${{ needs.prereq.outputs.squash_commit_sha }}
      squash_boundary_sha: ${{ needs.prereq.outputs.squash_boundary_sha }}
      build_run_id: ${{ needs.prereq.outputs.build_run_id }}
      consolidate_history: ${{ inputs.consolidate_history == true || inputs.consolidate_history == 'true' }}
      version_file: conf/configs/common.py
      version_pattern: 's/^__version__ = ".*"/__version__ = "${VERSION}"/'
      repo_slug: HeliumEdu/platform
    secrets:
      bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
