name: "Release"

run-name: "Release"

on:
  workflow_dispatch:
    inputs:
      trigger_deploy_after_release:
        description: 'Trigger deploy after release'
        required: true
        type: boolean
        default: true
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        default: prod
        options:
          - dev
          - prod
      consolidate_history:
        description: 'Reset develop to main after release (force-push).'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      trigger_deploy_after_release:
        description: "Trigger deploy after release"
        required: false
        type: boolean
        default: true
      environment:
        description: "Environment to deploy to"
        required: false
        type: string
        default: prod
      consolidate_history:
        description: "Reset develop to main after release (force-push)"
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "Released version"
        value: ${{ jobs.prereq.outputs.version }}

permissions:
  contents: write

concurrency:
  group: helium-platform-release

jobs:
  prereq:
    uses: alexdlaird/.github/.github/workflows/release-prereq.yml@main
    with:
      version_pattern: 's/^__version__ = ".*"/__version__ = "${VERSION}"/'
      version_file: conf/configs/common.py
      repo_slug: HeliumEdu/platform
    secrets:
      bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}

  promote:
    name: Promote Containers
    needs: [prereq]
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SOURCE_TAG: ${{ needs.prereq.outputs.squash_boundary_sha }}
      TAG_VERSION: ${{ needs.prereq.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag the AMD64 and ARM64 images with the release version
        run: |
          make promote PLATFORM=amd64
          make promote PLATFORM=arm64

  create-release-tag:
    name: Create Release Tag
    needs: [prereq, promote]
    if: "!cancelled() && needs.prereq.result == 'success' && needs.promote.result == 'success'"
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          skip-token-revoke: true

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}
          fetch-depth: 0

      - name: Get GitHub App bot user ID
        id: get-bot-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ needs.prereq.outputs.version }}
          COMMIT_SHA: ${{ needs.prereq.outputs.squash_commit_sha }}
        run: |
          git config --global user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config --global user.email "${{ steps.get-bot-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping"
          else
            echo "Creating tag $VERSION on commit $COMMIT_SHA"
            git tag -a "$VERSION" -m "Release $VERSION" "$COMMIT_SHA"
            git push origin "$VERSION"
          fi

      - name: Create Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VERSION: ${{ needs.prereq.outputs.version }}
        run: |
          pip install sentry-cli==3.6.2
          SENTRY_PROPERTIES=sentry.properties sentry-cli releases new "$VERSION"
          SENTRY_PROPERTIES=sentry.properties sentry-cli releases set-commits --auto "$VERSION"
          SENTRY_PROPERTIES=sentry.properties sentry-cli releases finalize "$VERSION"

  deploy:
    name: Deploy
    needs: [prereq, create-release-tag]
    if: "!cancelled() && (inputs.trigger_deploy_after_release == true || inputs.trigger_deploy_after_release == 'true') && needs.prereq.result == 'success' && needs['create-release-tag'].result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          skip-token-revoke: true

      - name: Run the deploy workflow and wait for it
        id: wait-for-deploy
        uses: alexdlaird/shipshape/run-workflow@v1
        with:
          workflow: deploy.yml
          ref: develop
          token: ${{ steps.app-token.outputs.token }}
          timeout-minutes: 55
          inputs: |
            version_type=specific
            specific_version=${{ needs.prereq.outputs.version }}
            environment=${{ inputs.environment }}

      - name: Deployment trigger summary
        if: always()
        env:
          VERSION: ${{ needs.prereq.outputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          RUN_URL: ${{ steps.wait-for-deploy.outputs.run-url }}
        run: |
          echo "### Deploy Workflow Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          if [ -n "$RUN_URL" ]; then
            echo "- **Run**: $RUN_URL" >> $GITHUB_STEP_SUMMARY
          fi

  cleanup:
    needs: [prereq, create-release-tag, deploy]
    if: always() && needs.prereq.result == 'success'
    uses: alexdlaird/.github/.github/workflows/release-cleanup.yml@main
    with:
      # Consolidation is honoured only when the release actually shipped. Any
      # earlier failure leaves the merge path, which keeps the granular history.
      consolidate_history: ${{ (inputs.consolidate_history == true || inputs.consolidate_history == 'true') && needs['create-release-tag'].result == 'success' }}
      squash_boundary_sha: ${{ needs.prereq.outputs.squash_boundary_sha }}
    secrets:
      bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}

  bump:
    needs: [create-release-tag, cleanup]
    if: always() && needs['create-release-tag'].result == 'success'
    uses: ./.github/workflows/bump-version.yml
    with:
      bump_type: next
    secrets: inherit
