name: Bump Version

run-name: Bump Version `${{ inputs.bump_type }}`

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Set the next release (every release already bumps develop to the next version)'
        required: true
        type: choice
        default: minor
        options:
          - minor
          - major
          - patch
  workflow_call:
    inputs:
      bump_type:
        required: true
        type: string

permissions:
  contents: write
  issues: none
  pull-requests: none

jobs:
  bump:
    uses: alexdlaird/.github/.github/workflows/bump-version.yml@main
    with:
      bump_type: ${{ inputs.bump_type }}
      version_pattern: 's/^__version__ = ".*"/__version__ = "${VERSION}"/'
      version_file: conf/configs/common.py
      repo_slug: HeliumEdu/platform
    secrets:
      bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
