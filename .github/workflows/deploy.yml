name: "Deploy"

run-name: "Deploy `${{ inputs.version_type == 'latest' && 'latest' || inputs.specific_version }}` to `${{ inputs.environment }}`"

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version to deploy'
        required: true
        type: choice
        default: latest
        options:
          - latest
          - specific
      specific_version:
        description: 'Specific version tag (only used if version_type is "specific", ex: 1.2.3)'
        required: false
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        default: prod
        options:
          - dev
          - prod
  workflow_call:
    inputs:
      version_type:
        description: "Version to deploy"
        required: false
        type: string
        default: latest
      specific_version:
        description: "Specific version tag (used when version_type is specific)"
        required: false
        type: string
      environment:
        description: "Environment to deploy to"
        required: false
        type: string
        default: prod

permissions:
  contents: read

concurrency:
  group: "helium-platform-deploy-${{inputs.environment}}"

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_number: ${{ steps.version.outputs.version }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          skip-token-revoke: true

      - name: Determine version to deploy
        id: version
        uses: alexdlaird/shipshape/resolve-release@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          version: ${{ inputs.version_type != 'latest' && inputs.specific_version || '' }}
          read-tag: false

  verify:
    name: Verify Containers
    needs: [determine-version]
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      VERSION_NUMBER: ${{ needs.determine-version.outputs.version_number }}

    steps:
      - name: Checkout platform repository
        uses: actions/checkout@v6

      - name: Verify containers exist
        run: ./bin/verify-release.sh "$VERSION_NUMBER"

  deploy:
    name: Deploy
    needs: [determine-version, verify]
    uses: inertlabs/.github/.github/workflows/terraform-deploy.yml@main
    with:
      component: platform
      version: ${{ needs.determine-version.outputs.version_number }}
      environment: ${{ inputs.environment }}
      version_variable: helium_version
      status_url: ${{ inputs.environment == 'prod' && 'https://api.heliumedu.com/info' || format('https://api.{0}.heliumedu.com/info', inputs.environment) }}
      other_release_prefix: "[connector]"
      tag_infra: true
    secrets:
      terraform_api_token: ${{ secrets.TERRAFORM_API_TOKEN }}
      helium_bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      helium_bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}

  post-deploy:
    name: Notify and Trigger Tests
    needs: [determine-version, deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          skip-token-revoke: true

      - name: Checkout platform repository
        uses: actions/checkout@v6

      - name: Set up Python "3.12"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Notify Sentry of deploy
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RELEASE_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          pip install sentry-cli==3.6.2
          SENTRY_PROPERTIES=sentry.properties sentry-cli releases deploys "$RELEASE_VERSION" new --env "${{ inputs.environment }}"

      - name: Trigger frontend integration tests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run integration.yml \
            --repo "$GITHUB_REPOSITORY_OWNER/frontend" \
            -f suite=full \
            -f environment=${{ inputs.environment }}

      - name: Trigger canary tests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run canary.yml \
            --repo "$GITHUB_REPOSITORY_OWNER/frontend" \
            -f environment=${{ inputs.environment }}

      - name: Deployment summary
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            URL="https://api.heliumedu.com"
          else
            URL="https://api.${ENVIRONMENT}.heliumedu.com"
          fi

          echo "### Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${ENVIRONMENT}" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL**: ${URL}" >> $GITHUB_STEP_SUMMARY
